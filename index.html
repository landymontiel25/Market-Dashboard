<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Signal Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --card:           #201f1e;
    --card-2:         #262524;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --good:           #0ca30c;
    --warning:        #fab219;
    --critical:       #e66767;
    --good-bg:        rgba(12,163,12,0.14);
    --warning-bg:     rgba(250,178,25,0.16);
    --critical-bg:    rgba(230,103,103,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.45;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { margin-bottom: 20px; }
  header.top h1 { font-size: 22px; margin: 0 0 4px; }
  header.top .sub { color: var(--text-secondary); font-size: 14px; margin: 0; }

  .tab-bar {
    display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab-btn {
    background: transparent; border: none; color: var(--text-secondary);
    font-size: 14px; padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--series-1); font-weight: 650; }
  .tab-btn:hover:not(.active) { color: var(--text-primary); }

  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .stat-tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px;
  }
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-tile .value { font-size: 26px; font-weight: 650; }
  .stat-tile .delta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  section { margin-bottom: 32px; }
  section > h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-secondary); margin: 0 0 12px; font-weight: 650;
  }

  .pulse-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px;
  }
  .pulse-card p { margin: 0 0 10px; font-size: 14.5px; }
  .pulse-card p:last-child { margin-bottom: 0; }
  .pulse-card .headline { font-size: 16px; font-weight: 600; margin-bottom: 10px; }

  .domain-list { display: grid; gap: 10px; }
  .domain-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
  }
  .domain-item .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--series-1);
    margin-top: 6px; flex-shrink: 0;
  }

  .source-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px;
  }
  .source-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .source-card .name { font-weight: 650; font-size: 14px; margin-bottom: 4px; }
  .source-card .count { font-size: 22px; font-weight: 650; color: var(--series-1); }
  .source-card .desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; margin-bottom: 10px; }
  .source-card .links { display: flex; flex-direction: column; gap: 5px; }
  .source-card .links a {
    font-size: 12px; color: var(--series-1); text-decoration: none; word-break: break-word;
  }
  .source-card .links a:hover { text-decoration: underline; }

  figure.chart {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 22px 16px; margin: 0;
  }
  figure.chart figcaption { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 230px; flex-shrink: 0; font-size: 12.5px; color: var(--text-primary); text-align: right; }
  .bar-track { flex: 1; background: var(--gridline); border-radius: 4px; height: 20px; position: relative; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--series-1); }
  .bar-value { font-size: 12px; color: var(--text-secondary); margin-left: 8px; white-space: nowrap; }
  .chart-note { font-size: 11.5px; color: var(--text-muted); margin-top: 10px; }
  .table-toggle {
    font-size: 12px; border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); border-radius: 6px; padding: 5px 10px; cursor: pointer; margin-top: 12px;
  }
  table.data-table {
    width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; display: none;
  }
  table.data-table.show { display: table; }
  table.data-table th, table.data-table td {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--gridline);
  }

  .legend-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  .prob-list { display: grid; gap: 12px; }
  .prob-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px;
  }
  .prob-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px;
  }
  .prob-rank-title { display: flex; gap: 10px; align-items: baseline; }
  .prob-rank { font-size: 15px; font-weight: 700; color: var(--text-muted); }
  .prob-title { font-weight: 650; font-size: 15px; }
  .status-badge {
    font-size: 11px; font-weight: 650; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; height: fit-content; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  }
  .status-badge.good { background: var(--good-bg); color: var(--good); }
  .status-badge.warning { background: var(--warning-bg); color: var(--warning); }
  .status-badge.critical { background: var(--critical-bg); color: var(--critical); }

  .prob-part { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 6px 0; font-size: 13.5px; }
  .prob-part .k { color: var(--text-muted); font-weight: 650; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding-top: 2px; }
  .prob-part .v { color: var(--text-secondary); }
  .prob-part .v a { color: var(--series-1); text-decoration: none; }
  .prob-part .v a:hover { text-decoration: underline; }
  .prob-part.problem .v { color: var(--text-primary); }

  footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 40px; }
</style>
</head>

        description:"This affects roughly 18,000 US police departments. Existing vendors win contracts through long relationships instead of better software.",
        solution:"Modern records software aimed at winning smaller, newer departments first, before competing for the big legacy contracts.",
        link:"https://news.ycombinator.com/item?id=22496129"}
    ]
  }
};

const statusLabel = {good: "Open", warning: "Emerging", critical: "Crowded"};

function parseSize(s) {
  const m = s.match(/\$([\d,.]+)([MB])/);
  if (!m) return 1;
  let v = parseFloat(m[1].replace(/,/g,''));
  if (m[2] === 'B') v *= 1000;
  return v;
}

function renderDay(dateKey) {
  const d = days[dateKey];
  const el = document.createElement('div');

  // stats
  const statRow = document.createElement('div');
  statRow.className = 'stat-row';
  d.stats.forEach(s => {
    statRow.innerHTML += `<div class="stat-tile"><div class="label">${s.label}</div><div class="value">${s.value}</div><div class="delta">${s.delta}</div></div>`;
  });
  el.appendChild(statRow);

  // pulse
  const pulseSec = document.createElement('section');
  pulseSec.innerHTML = `<h2>Pulse check</h2><div class="pulse-card"><div class="headline">${d.pulse.headline}</div>${d.pulse.paras.map(p=>`<p>${p}</p>`).join('')}</div>`;
  el.appendChild(pulseSec);

  // domain
  const domainSec = document.createElement('section');
  domainSec.innerHTML = `<h2>Domain relevance — what this means for building something here</h2><div class="domain-list">${d.domain.map(x=>`<div class="domain-item"><div class="dot"></div><div>${x}</div></div>`).join('')}</div>`;
  el.appendChild(domainSec);

  // sources
  const sourceSec = document.createElement('section');
  sourceSec.innerHTML = `<h2>Source mix</h2><div class="source-grid">${d.sources.map(s => `
    <div class="source-card">
      <div class="name">${s.name}</div>
      <div class="count">${s.count}</div>
      <div class="desc">${s.desc}</div>
      <div class="links">${s.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div>
    </div>`).join('')}</div>`;
  el.appendChild(sourceSec);

  // chart
  const chartSec = document.createElement('section');
  const chartId = 'bar-chart-' + dateKey;
  const tableId = 'market-table-' + dateKey;
  chartSec.innerHTML = `<h2>Conservative market size — top 10</h2>
    <figure class="chart">
      <figcaption>Rough, deliberately conservative estimate of annual addressable spend ($M), sorted by size. Health insurance denials is verified (AHA); the rest are back-of-envelope floors built from named counts × plausible price points, not vendor marketing figures.</figcaption>
      <div id="${chartId}"></div>
      <div class="chart-note">Scale: log-adjusted bar widths so #1 doesn't flatten the other nine — see table view for exact figures.</div>
      <button class="table-toggle" onclick="document.getElementById('${tableId}').classList.toggle('show')">Show table view</button>
      <table class="data-table" id="${tableId}">
        <thead><tr><th>Rank</th><th>Problem</th><th>Estimate</th><th>Basis</th></tr></thead>
        <tbody>${d.chart.map(p=>`<tr><td>${p.rank}</td><td>${p.title}</td><td>${p.size}</td><td>${p.basis}</td></tr>`).join('')}</tbody>
      </table>
    </figure>`;
  el.appendChild(chartSec);

  // ideas
  const ideaSec = document.createElement('section');
  ideaSec.innerHTML = `<h2>All 20, ranked</h2>
    <div class="legend-row">
      <div class="legend-item"><div class="legend-swatch" style="background:var(--good)"></div>Open whitespace — no dominant player</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--warning)"></div>Emerging competition — early/small players</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--critical)"></div>Crowded — well-funded incumbents</div>
    </div>
    <div class="prob-list">${d.ideas.map(p => `
      <div class="prob-card">
        <div class="prob-head">
          <div class="prob-rank-title"><div class="prob-rank">${p.rank}</div><div class="prob-title">${p.title}</div></div>
          <div class="status-badge ${p.status}">${statusLabel[p.status]}</div>
        </div>
        <div class="prob-part problem"><div class="k">Problem</div><div class="v">${p.problem}</div></div>
        <div class="prob-part"><div class="k">Description</div><div class="v">${p.description}</div></div>
        <div class="prob-part"><div class="k">Solution</div><div class="v">${p.solution}</div></div>
        <div class="prob-part"><div class="k">Source</div><div class="v"><a href="${p.link}" target="_blank" rel="noopener">${p.link} ↗</a></div></div>
      </div>`).join('')}</div>`;
  el.appendChild(ideaSec);

  // render bar chart after insertion (needs DOM)
  requestAnimationFrame(() => {
    const chartEl = document.getElementById(chartId);
    const top10 = d.chart;
    const values = top10.map(p => parseSize(p.size));
    const logValues = values.map(v => Math.log10(v + 1));
    const maxLog = Math.max(...logValues);
    top10.forEach((p, i) => {
      const pct = (logValues[i] / maxLog) * 100;
      const row = document.createElement('div');
      row.className = 'bar-row';
      const shortTitle = p.title.length > 34 ? p.title.slice(0,34)+'…' : p.title;
      row.innerHTML = `<div class="bar-label">${p.rank}. ${shortTitle}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-value">${p.size}</div>`;
      chartEl.appendChild(row);
    });
  });

  return el;
}

function showTab(dateKey) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.date === dateKey));
  const content = document.getElementById('tab-content');
  content.innerHTML = '';
  content.appendChild(renderDay(dateKey));
}

const tabBar = document.getElementById('tab-bar');
const dateKeys = Object.keys(days);
dateKeys.forEach((k, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
  btn.dataset.date = k;
  btn.textContent = days[k].label;
  btn.onclick = () => showTab(k);
  tabBar.appendChild(btn);
});
showTab(dateKeys[0]);
</script>
</body>
</html>
